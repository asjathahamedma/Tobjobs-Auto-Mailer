name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release tag matches app version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$packageVersion" -ne $env:GITHUB_REF_NAME) {
            throw "Release tag $env:GITHUB_REF_NAME does not match package version $packageVersion."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Install portable Python runtime and dependencies
        shell: pwsh
        run: |
          uv python install 3.12 --install-dir .python
          $python = Get-ChildItem .python -Filter python.exe -Recurse |
            Where-Object { $_.FullName -notmatch '\\Scripts\\' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $python) {
            throw "Could not find python.exe in the portable Python runtime."
          }
          "TOPJOBS_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          uv pip install --python $python -r requirements.txt

      - name: Validate application
        shell: pwsh
        run: |
          npm run typecheck
          & $env:TOPJOBS_PYTHON -m unittest discover -s tests -v

      - name: Build Windows installer
        run: npm run tauri:build

      - name: Publish installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TopJobs Auto Mailer ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
