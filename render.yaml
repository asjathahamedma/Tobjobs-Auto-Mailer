services:
  - type: web
    name: topjobs-auto-mailer-api
    runtime: docker
    plan: free
    dockerfilePath: ./web_backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: APP_CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: WEB_ALLOWED_ORIGINS
        sync: false
